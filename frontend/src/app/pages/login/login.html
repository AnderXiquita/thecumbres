<div class="login">
  <div>
    <header class="login-top">
      <span>Guatemala · Tierra de volcanes</span>
      <span>14.50° N · 90.88° O</span>
    </header>

    <h1 class="logo login-logo">TheCumbres</h1>
    <p class="login-lema">Gestión de tours a volcanes de Guatemala</p>
  </div>

    <form class="login-panel" [formGroup]="form" (ngSubmit)="ingresar()">
    <span class="panel-etiqueta">Acceso</span>
    <h2 class="logo panel-titulo">Inicia sesión</h2>

    @if (error) {
      <div class="login-error">{{ error }}</div>
    }

    <div class="campo">
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        class="form-control login-input"
        formControlName="usuario"
        autocomplete="username"
        [class.is-invalid]="form.controls.usuario.invalid && form.controls.usuario.touched"
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        class="form-control login-input"
        formControlName="password"
        autocomplete="current-password"
        [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
    </div>

    <button type="submit" class="btn login-boton" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      <span aria-hidden="true">&rarr;</span>
    </button>
  </form>
</div>
